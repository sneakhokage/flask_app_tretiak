{% extends "base.html" %}

{% block title %}Account{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title">Ласкаво просимо, {{ username }}!</h2>
                <p class="lead">Ви успішно ввійшли в свій профіль</p>
                <hr>
                <p><strong>Email:</strong> {{ email }}</p>
                
                <div class="mt-4">
                    <a href="{{ url_for('users.logout') }}" class="btn btn-danger">Logout</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
